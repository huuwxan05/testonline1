services:
  - type: web
    name: royal-online
    runtime: docker
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /api/index.php?action=health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: ROYAL CASINO
      - key: SESSION_NAME
        value: royal_session
      - key: DATABASE_URL
        fromDatabase:
          name: royal-db
          property: connectionString
      - key: APP_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false

databases:
  - name: royal-db
    plan: free
    region: singapore
    postgresMajorVersion: '18'
    databaseName: royal_casino
    user: royal_user
